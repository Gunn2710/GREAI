server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # API calls go to the backend container, so the browser sees one origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI grading can take a while
    }

    # Vite's hashed bundles never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate index.html so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/study, /words/12, ...) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
