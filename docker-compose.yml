# GRE AI: full stack in Docker.
#
#   docker compose up --build
#
# Compose reads the root .env twice: for the ${...} values below (the Clerk
# publishable key for the frontend build) and, through env_file, as the
# backend's settings at run time. Nothing secret is baked into an image.
#
# Then open http://localhost:8080

name: gre-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gre
      POSTGRES_PASSWORD: gre        # local-only database, not reachable from your network
      POSTGRES_DB: gre
    ports:
      - "127.0.0.1:5433:5432"     # this machine only; for the dev-auth stack in the README
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gre -d gre"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: backend
    env_file:
      - path: .env
        required: false
    environment:
      # Docker uses the local db service, so .env can keep pointing
      # at Supabase. Set DATABASE_URL to your Supabase Session pooler string
      # to use Supabase instead (the direct connection is IPv6-only).
      GRE_DATABASE_URL: ${DATABASE_URL:-postgresql://gre:gre@db:5432/gre}
      # Clerk session tokens name the site they were issued for.
      GRE_CLERK_AUTHORIZED_PARTIES: '["${APP_ORIGIN:-http://localhost:8080}"]'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
